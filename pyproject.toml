[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-intelligence-engine"
version = "0.1.0"
description = "Speech foundation model representation and paralinguistic intelligence layer"
readme = "README.md"
authors = [{ name = "Speech AI Team" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0"
]

[project.scripts]
speech-intel = "speech_intelligence_engine.cli:main"
